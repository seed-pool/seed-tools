[package]
name = "seedbrr"
version = "0.54.0"
edition = "2021"

[dependencies]
chrono = "0.4"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
glob = "0.3"
rand = "0.8"
reqwest = { version = "0.12", features = ["blocking", "cookies", "multipart", "json", "stream"] }
urlencoding = "2.1"
regex = "1.10"
base64 = "0.22.1"
include_dir = "0.7"
serde_json = "1.0"
tempfile = "3.8"
indicatif = "0.17"
crossterm = "0.28"
dialoguer = "0.11"
log = "0.4"
simplelog = "0.12"
serde_bencode = "0.2.4"
clap = { version = "4.5", features = ["derive"] }
irc = "1.1.0"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
ratatui = "0.29"
walkdir = "2.5"
tail = "0.3"
notify = "6.1"
winnow = "0.6"
vte = "0.13"
ctrlc = "3.4"
epub = "2.1.3"
lopdf = "0.33"
zip = "2.1"
which = "6.0"

[package.metadata.bundle]
resources = ["binaries/"]

[profile.release]
lto = true

[[bin]]
name = "seedbrr"
path = "src/main.rs"

[[bin]]
name = "test-media-classification"
path = "src/bin/test_media_classification.rs"

[[bin]]
name = "test-full-process"
path = "src/bin/test_full_process.rs"

[[bin]]
name = "test-process-classification"
path = "src/bin/test_process_classification.rs"
