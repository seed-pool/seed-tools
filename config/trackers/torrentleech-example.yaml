# TorrentLeech tracker configuration
# Copy this file to torrentleech.yaml and update with your credentials

general:
  enabled: true
  announce_url_1: "https://torrentleech.org/announce/your_passkey"
  announce_url_2: "https://torrentleech.org/announce2/your_passkey"

settings:
  stripshit_from_videos: false
  tl_key: "your_torrentleech_api_key"
  upload_url: "https://torrentleech.org/api/upload"
  custom_description: ""

  # Upload components
  enable_mediainfo: true
  enable_screenshots: false  # TL handles screenshots
  enable_sample: false
  enable_nfo: true
  enable_tmdb: true
  enable_torrent_creation: false
  enable_duplicate_check: true
  enable_alt_description: false  # Generate image-based description instead of BBCode
  screenshot_count: 4

