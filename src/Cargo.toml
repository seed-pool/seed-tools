[package]
name = "seedbrr-reorganized"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "seedbrr"
path = "main.rs"

[[bin]]
name = "test-media-classification"
path = "bin/test_media_classification.rs"

[[bin]]
name = "test-full-process"
path = "bin/test_full_process.rs"

[[bin]]
name = "test-process-classification"
path = "bin/test_process_classification.rs"

[[bin]]
name = "test-recursive"
path = "bin/test_recursive.rs"

[[bin]]
name = "test-descriptions"
path = "bin/test_descriptions.rs"

[[bin]]
name = "test-description-analysis"
path = "bin/test_description_analysis.rs"

[[bin]]
name = "test-templates"
path = "bin/test_templates.rs"

[[bin]]
name = "test-dry-run-description"
path = "bin/test_dry_run_description.rs"

[lib]
name = "seedbrr"
path = "lib.rs"

[dependencies]
# Core dependencies
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
log = "0.4"
simplelog = "0.12"
regex = "1.5"
chrono = "0.4"
rand = "0.8"

# HTTP and API clients
reqwest = { version = "0.11", features = ["blocking", "json", "multipart", "cookies"] }
async-trait = "0.1"

# File system and paths
walkdir = "2"

# Terminal UI
ratatui = "0.26"
crossterm = "0.27"

# IRC
irc = "0.15"
futures-util = "0.3"

# Torrent
sha1 = "0.10"
urlencoding = "2.1"
serde_bencode = "0.2"

# Media processing
lopdf = "0.31"
epub = "2.0"
zip = "0.6"

# Additional dependencies that might be needed
base64 = "0.21"
hex = "0.4"
once_cell = "1.17"