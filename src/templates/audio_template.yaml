name: "default"
media_type: "audio"
version: "1.0"
description: "Default audio template with MusicBrainz integration"

layout:
  title_color: "#2E86C1"
  author_color: "#117A65"
  section_colors:
    tracklist: "#6C3483"
    details: "#117A65"
    default: "#2E86C1"
  image_layout: "single_column"
  image_width: 600
  max_images: 2
  include_footer: true

sections:
  - name: "basic_info"
    section_type: "raw"
    content: |
      [b]{{filename}}[/b]
      [b]Artist:[/b] {{musicbrainz_artist|artist|mediainfo_artist|default:"Unknown Artist"}}
      [b]Album:[/b] {{musicbrainz_title|album|mediainfo_album|default:"Unknown Album"}}
      [b]Year:[/b] {{musicbrainz_year|year|mediainfo_year|default:"Unknown"}}
      [b]Genre:[/b] {{musicbrainz_genres|genre|mediainfo_genre|default:"Unknown"}}
      [b]Audio:[/b] {{audio_format|default:"Unknown Format"}} {{audio_bitrate|default:""}} / {{audio_sample_rate|default:""}}
    order: 1

  - name: "tracklist_table"
    section_type: "raw"
    content: |
      [table]
      [tr][th]Nr.[/th][th]Artist[/th][th]Title[/th][th]Duration[/th][th]Size[/th][th]Format[/th][th]Bitrate[/th][/tr]
      {{tracklist_rows|default:"[tr][td colspan=7]No tracklist available[/td][/tr]"}}
      [/table]
    order: 2

  - name: "images"
    section_type: "images"
    order: 3

conditionals:
  - name: "24bit"
    condition: "field_equals:is_24bit:true"
    section:
      name: "quality_note"
      section_type: "custom"
      content: "High Definition 24-bit Audio"
      format: "colored"
      color: "#E74C3C"