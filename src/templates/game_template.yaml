name: "default"
media_type: "game"
version: "1.0"
description: "Default game template with IGDB integration"

layout:
  title_color: "#2E86C1"
  author_color: "#117A65"
  section_colors:
    summary: "#6C3483"
    details: "#117A65"
    companies: "#2E86C1"
    default: "#2E86C1"
  image_layout: "grid2x2"
  image_width: 720
  max_images: 6
  include_footer: true

sections:
  - name: "title"
    section_type: "title"
    content: "{{igdb_title}}"
    order: 1
    required_fields: ["igdb_title"]

  - name: "developer"
    section_type: "author"
    content: "{{igdb_developer}}"
    order: 2
    required_fields: ["igdb_developer"]

  - name: "summary"
    section_type: "synopsis"
    content: "{{igdb_summary}}"
    order: 3
    required_fields: ["igdb_summary"]

  - name: "images"
    section_type: "images"
    order: 4

  - name: "details"
    section_type: "table"
    order: 5
    table_fields:
      - label: "Genre"
        field: "igdb_genres"
      - label: "Platform"
        field: "igdb_platforms"
      - label: "Release Date"
        field: "igdb_release_year"
      - label: "Game Modes"
        field: "igdb_game_modes"
      - label: "Rating"
        field: "igdb_rating"
        format: "{{value}}/100"
      - label: "Publisher"
        field: "igdb_publisher"
      - label: "Category"
        field: "category"

  - name: "websites"
    section_type: "custom"
    content: "{{igdb_websites}}"
    format: "quoted"
    order: 6
    required_fields: ["igdb_websites"]

conditionals:
  - name: "storyline"
    condition: "field_exists:igdb_storyline"
    section:
      name: "storyline"
      section_type: "custom"
      content: "{{igdb_storyline}}"
      format: "spoiler"

  - name: "multiplayer"
    condition: "field_exists:igdb_multiplayer_modes"
    section:
      name: "multiplayer"
      section_type: "custom"
      content: "{{igdb_multiplayer_modes}}"
      format: "quoted"
      order: 8

  - name: "custom_description"
    condition: "field_exists:custom_description"
    section:
      name: "custom_description"
      section_type: "raw"
      content: "{{custom_description}}"
      order: 9